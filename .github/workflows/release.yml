name: Release

# Build the app once per environment (per-env config is baked in) and publish
# the bundles as a GitHub Release. Deployment happens separately, from the
# operations repo: `scripts/deploy app resume <env> <tag>`.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Build (prod)
        run: npm run build && tar -czf dist-prod.tgz -C dist . && rm -rf dist
        env:
          VITE_BASE_PATH: /resume/
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          VITE_API_BASE_URL: https://api.peteshepley.com/resume/v1

      - name: Build (stage)
        run: npm run build && tar -czf dist-stage.tgz -C dist . && rm -rf dist
        env:
          VITE_BASE_PATH: /resume/
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_STAGE }}
          VITE_API_BASE_URL: https://api.stage.peteshepley.com/resume/v1

      - name: Manifest
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"static", mode:"spa", base_path:"/resume/", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist-prod.tgz dist-stage.tgz manifest.json \
            --title "$TAG" \
            --notes "Build of ${GITHUB_SHA:0:7} for app.peteshepley.com/resume"
