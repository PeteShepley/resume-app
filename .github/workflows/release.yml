name: Release

# Build the app once per environment (per-env config is baked in) and publish
# the bundles as a GitHub Release. Deployment happens separately, from the
# operations repo: `scripts/deploy app resume <env> <tag>`.
#
# The Clerk publishable keys come from SSM (/clerk/<env>/public/publishable-key),
# read via the gha-build-config-reader OIDC role. Needs repo var AWS_ACCOUNT_ID.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Show OIDC subject
        run: |
          jwt=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,base64,json; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))" "$jwt"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-build-config-reader
          aws-region: us-east-1

      - name: Build per environment
        run: |
          set -euo pipefail
          for E in prod stage; do
            PK=$(aws ssm get-parameter --name "/clerk/$E/public/publishable-key" \
                   --with-decryption --query Parameter.Value --output text)
            if [ "$E" = prod ]; then
              API=https://api.peteshepley.com/resume/v1
            else
              API=https://api.stage.peteshepley.com/resume/v1
            fi
            VITE_BASE_PATH=/resume/ \
            VITE_CLERK_PUBLISHABLE_KEY="$PK" \
            VITE_API_BASE_URL="$API" \
              npm run build
            tar -czf "dist-$E.tgz" -C dist .
            rm -rf dist
          done

      - name: Manifest
        run: |
          jq -n --arg sha "$GITHUB_SHA" \
            '{type:"static", mode:"spa", base_path:"/resume/", commit:$sha}' > manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist-prod.tgz dist-stage.tgz manifest.json \
            --title "$TAG" \
            --notes "Build of ${GITHUB_SHA:0:7} for app.peteshepley.com/resume"
